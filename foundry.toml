[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
# Recompile on every `forge build` invocation instead of using cached artifacts.
force = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
